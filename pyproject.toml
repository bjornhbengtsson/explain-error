[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xerr"
version = "0.1.0"
description = "Explain error messages in plain English, with fixes. Offline, zero dependencies, 100+ rules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["error", "debugging", "traceback", "cli", "beginners", "stack-trace", "claude", "ai"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
ai = ["anthropic"]
dev = ["pytest"]

[project.scripts]
explain-error = "explain_error.cli:main"
xerr = "explain_error.cli:main"

[project.urls]
Homepage = "https://github.com/bjornhbengtsson/explain-error"
Issues = "https://github.com/bjornhbengtsson/explain-error/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_error"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
